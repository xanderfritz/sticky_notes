{% extends 'base.html' %}
{% block title %}
  Sticky Notes - {% if form.instance.pk %}Edit{% else %}New{% endif %} Note
{% endblock %}
{% block content %}
  <h2>{% if form.instance.pk %}Edit{% else %}New{% endif %} Note</h2>
  <form method="post"
        action="{% if form.instance.pk %}{% url 'note_update' pk=form.instance.pk %}{% else %}{% url 'note_create' %}{% endif %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
  </form>
  <a class="btn" href="{% url 'note_list' %}">Back</a>
{% endblock %}
