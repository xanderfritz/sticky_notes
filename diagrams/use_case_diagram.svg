<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" font-family="Arial" font-size="14">
  <rect width="700" height="500" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold">Sticky Notes - Use Case Diagram</text>

  <!-- Actor -->
  <circle cx="80" cy="250" r="18" fill="none" stroke="black" stroke-width="2"/>
  <line x1="80" y1="268" x2="80" y2="320" stroke="black" stroke-width="2"/>
  <line x1="80" y1="285" x2="55" y2="305" stroke="black" stroke-width="2"/>
  <line x1="80" y1="285" x2="105" y2="305" stroke="black" stroke-width="2"/>
  <line x1="80" y1="320" x2="55" y2="355" stroke="black" stroke-width="2"/>
  <line x1="80" y1="320" x2="105" y2="355" stroke="black" stroke-width="2"/>
  <text x="80" y="380" text-anchor="middle">User</text>

  <!-- System boundary -->
  <rect x="240" y="70" width="420" height="400" fill="none" stroke="black" stroke-width="1"/>
  <text x="450" y="90" text-anchor="middle" font-weight="bold">Sticky Notes App</text>

  <!-- Use cases -->
  <ellipse cx="450" cy="140" rx="110" ry="30" fill="#fff8b0" stroke="black"/>
  <text x="450" y="145" text-anchor="middle">Create note</text>

  <ellipse cx="450" cy="210" rx="110" ry="30" fill="#fff8b0" stroke="black"/>
  <text x="450" y="215" text-anchor="middle">View notes list</text>

  <ellipse cx="450" cy="280" rx="110" ry="30" fill="#fff8b0" stroke="black"/>
  <text x="450" y="285" text-anchor="middle">View note details</text>

  <ellipse cx="450" cy="350" rx="110" ry="30" fill="#fff8b0" stroke="black"/>
  <text x="450" y="355" text-anchor="middle">Edit note</text>

  <ellipse cx="450" cy="420" rx="110" ry="30" fill="#fff8b0" stroke="black"/>
  <text x="450" y="425" text-anchor="middle">Delete note</text>

  <!-- Actor to use case lines -->
  <line x1="110" y1="300" x2="340" y2="140" stroke="black"/>
  <line x1="110" y1="300" x2="340" y2="210" stroke="black"/>
  <line x1="110" y1="300" x2="340" y2="280" stroke="black"/>
  <line x1="110" y1="300" x2="340" y2="350" stroke="black"/>
  <line x1="110" y1="300" x2="340" y2="420" stroke="black"/>
</svg>
