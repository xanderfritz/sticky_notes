<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" font-family="Arial" font-size="13">
  <rect width="800" height="560" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">Sticky Notes - Sequence Diagram (Create Note)</text>

  <!-- Lifelines -->
  <rect x="40" y="60" width="100" height="30" fill="#e3f0ff" stroke="black"/>
  <text x="90" y="80" text-anchor="middle">User</text>
  <line x1="90" y1="90" x2="90" y2="530" stroke="black" stroke-dasharray="4"/>

  <rect x="200" y="60" width="100" height="30" fill="#e3f0ff" stroke="black"/>
  <text x="250" y="80" text-anchor="middle">URL Router</text>
  <line x1="250" y1="90" x2="250" y2="530" stroke="black" stroke-dasharray="4"/>

  <rect x="360" y="60" width="100" height="30" fill="#e3f0ff" stroke="black"/>
  <text x="410" y="80" text-anchor="middle">View</text>
  <line x1="410" y1="90" x2="410" y2="530" stroke="black" stroke-dasharray="4"/>

  <rect x="520" y="60" width="100" height="30" fill="#e3f0ff" stroke="black"/>
  <text x="570" y="80" text-anchor="middle">NoteForm</text>
  <line x1="570" y1="90" x2="570" y2="530" stroke="black" stroke-dasharray="4"/>

  <rect x="680" y="60" width="100" height="30" fill="#e3f0ff" stroke="black"/>
  <text x="730" y="80" text-anchor="middle">Note Model</text>
  <line x1="730" y1="90" x2="730" y2="530" stroke="black" stroke-dasharray="4"/>

  <!-- Arrows -->
  <line x1="90" y1="130" x2="245" y2="130" stroke="black" marker-end="url(#arrow)"/>
  <text x="167" y="125" text-anchor="middle">GET /note/new/</text>

  <line x1="250" y1="170" x2="405" y2="170" stroke="black" marker-end="url(#arrow)"/>
  <text x="327" y="165" text-anchor="middle">route to note_create</text>

  <line x1="410" y1="210" x2="565" y2="210" stroke="black" marker-end="url(#arrow)"/>
  <text x="487" y="205" text-anchor="middle">NoteForm()</text>

  <line x1="565" y1="245" x2="415" y2="245" stroke="black" marker-end="url(#arrow)"/>
  <text x="490" y="240" text-anchor="middle">empty form</text>

  <line x1="405" y1="285" x2="95" y2="285" stroke="black" marker-end="url(#arrow)"/>
  <text x="250" y="280" text-anchor="middle">render form page</text>

  <line x1="90" y1="325" x2="245" y2="325" stroke="black" marker-end="url(#arrow)"/>
  <text x="167" y="320" text-anchor="middle">POST form data</text>

  <line x1="250" y1="360" x2="405" y2="360" stroke="black" marker-end="url(#arrow)"/>
  <text x="327" y="355" text-anchor="middle">note_create()</text>

  <line x1="410" y1="400" x2="565" y2="400" stroke="black" marker-end="url(#arrow)"/>
  <text x="487" y="395" text-anchor="middle">is_valid() + save()</text>

  <line x1="570" y1="440" x2="725" y2="440" stroke="black" marker-end="url(#arrow)"/>
  <text x="647" y="435" text-anchor="middle">INSERT Note</text>

  <line x1="405" y1="490" x2="95" y2="490" stroke="black" marker-end="url(#arrow)"/>
  <text x="250" y="485" text-anchor="middle">redirect to note_list</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="black"/>
    </marker>
  </defs>
</svg>
